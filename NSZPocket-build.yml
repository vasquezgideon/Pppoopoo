# Save this file in your repository at: .github/workflows/build.yml
# Add NSZPocket-Project.zip to the repository ROOT, without extracting it.
# Actions > Build NSZPocket IPA > Run workflow. Output is unsigned.
name: Build NSZPocket IPA

on:
  workflow_dispatch:
  push:
    paths:
      - NSZPocket-Project.zip
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  ios:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare app source and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s NSZPocket-Project.zip || { echo 'Missing NSZPocket-Project.zip in repository root'; exit 1; }
          mkdir -p NSZPocketBuild
          unzip -q NSZPocket-Project.zip -d NSZPocketBuild
          cd NSZPocketBuild
          test -f project.yml
          test -f Sources/NSZPocketApp.swift
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          mkdir -p Vendor
          curl --fail --location --retry 4 --retry-delay 3 \
            --output /tmp/nszpocket-zstd.tar.gz \
            https://github.com/facebook/zstd/archive/refs/tags/v1.5.7.tar.gz
          tar -xzf /tmp/nszpocket-zstd.tar.gz -C Vendor
          mv Vendor/zstd-1.5.7 Vendor/zstd
          test -f Vendor/zstd/lib/zstd.h
          xcodegen generate --spec project.yml

      - name: Compile for real iPhones (arm64)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project NSZPocketBuild/NSZPocket.xcodeproj \
            -scheme NSZPocket \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=DerivedData/Build/Products/Release-iphoneos/NSZPocket.app
          test -d "$APP"
          test -f "$APP/NSZPocket"
          mkdir -p ipa/Payload
          ditto "$APP" ipa/Payload/NSZPocket.app
          ( cd ipa && zip -qry NSZPocket-unsigned.ipa Payload )
          unzip -t ipa/NSZPocket-unsigned.ipa | tail -n 2
          ls -lh ipa/NSZPocket-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NSZPocket-unsigned-IPA
          path: ipa/NSZPocket-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
